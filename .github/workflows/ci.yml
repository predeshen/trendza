name: Trendza CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        working-directory: wp-content/plugins/trendza-core
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: |
          find wp-content/plugins/trendza-core/src wp-content/plugins/trendza-core/tests wp-content/plugins/trendza-core/trendza-core.php wp-content/themes/trendza -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Theme JavaScript syntax check
        run: node --check wp-content/themes/trendza/assets/js/theme.js
      - name: PHPUnit
        working-directory: wp-content/plugins/trendza-core
        run: vendor/bin/phpunit
